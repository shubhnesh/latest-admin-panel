name: rdx_admin
description: RDX Admin - Restaurant Admin Dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.69.0
  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.3.4
  firebase_storage: ^12.3.7
  file_picker: ^11.0.3
  flutter_svg: ^2.2.3
  cloud_functions: ^5.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The "flutter_lints" package contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package
  # is activated in the `analysis_options.yaml` file located at the root
  # of your project. See that file for information about deactivating
  # specific lint rules and activating additional ones.
  flutter_lints: ^5.0.0

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  # - images/a_dot_burr.jpeg
  # - images/a_dot_ham.jpeg
  assets:
    - assets/images/logo/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here, in this
  # section. Each entry in this list should have a "family" key with the font
  # family name, and a "fonts" key with a list giving the asset and other
  # descriptors for the font. For example:
  #
  # fonts:
  # - family: Schyler
  #   fonts:
  #   - asset: fonts/Schyler-Regular.ttf
  #   - asset: fonts/Schyler-Italic.ttf
  #     style: italic
  # - family: Trajan Pro
  #   fonts:
  #   - asset: fonts/TrajanPro.ttf
  #     weight: 700